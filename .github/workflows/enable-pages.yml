name: enable-pages
on:
  push:
    branches: [cursor/deploy-nox-gallery-b811]
  workflow_dispatch:
permissions:
  pages: write
  contents: read
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages from main root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "POST pages"
          gh api --method POST "repos/${{ github.repository }}/pages" \
            -f build_type=legacy \
            -f "source[branch]=main" \
            -f "source[path]=/" > /tmp/pages-post.json
          echo "post_exit:$?"
          cat /tmp/pages-post.json
          echo
          echo "GET pages"
          gh api "repos/${{ github.repository }}/pages" > /tmp/pages-get.json
          echo "get_exit:$?"
          cat /tmp/pages-get.json
          echo
          # Fail the job only if the site still does not exist.
          gh api "repos/${{ github.repository }}/pages" --jq .html_url
